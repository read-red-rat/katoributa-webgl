<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1b2a44">
    <title>縁側と蚊取りブタ</title>
    <style>
      /* 画面いっぱいにキャンバスを敷く（スマホの横・縦、PC のウィンドウどれでも UI が切れないように） */
      html, body { margin: 0; height: 100%; background: #1b2a44; overflow: hidden; }
      #unity-canvas {
        position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
        display: block; background: #1b2a44; touch-action: none; outline: none;
        -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
      }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; color: #f4efe2; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: 0.12em;
        background: #1b2a44; transition: opacity 0.8s ease;
      }
      #loading .title { font-size: 20px; }
      #loading .bar { width: min(240px, 60vw); height: 2px; background: rgba(244, 239, 226, 0.2); }
      #loading .fill { width: 0; height: 100%; background: #c8553d; transition: width 0.2s; }
      #loading .sound { font-size: 16px; color: #f4efe2; margin-top: 6px; }
      #loading .note { font-size: 13px; opacity: 0.7; }
      #error { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: #8a2b1d; color: #fff;
        font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="title">縁側と蚊取りブタ</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="sound">♪ 音が出ます</div>
      <div class="note">読み込みに少し時間がかかります</div>
    </div>
    <div id="error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#fill");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // エラーだけを表示する（Unity 標準の「モバイル非対応」の帯は出さない）
      function showBanner(msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        var e = document.querySelector("#error");
        e.textContent = msg;
        e.style.display = "block";
      }

      var buildUrl = "Build";
      // ビルドごとに変わる番号（KatoributaWebGLBuilder がビルド後に書き込む）。ブラウザに残った古い
      // framework.js と新しい wasm が混ざると起動時に落ちるので、URL を毎回変えてキャッシュを分ける
      var v = "?v=20261121102139";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb" + v,
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb" + v,
        codeUrl: buildUrl + "/WebGL.wasm.unityweb" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "縁側と蚊取りブタ",
        productVersion: "0.1.0",
        showBanner: showBanner,
        // スマホは高解像度のまま描くと重いので、描画の解像度を最大 2 倍までに抑える
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobile ? 2 : 2.5),
      };
      // 確認用：?dpr=1 で描画解像度を下げる（エミュレータなど遅い環境で操作を軽くする）
      var dprParam = /[?&]dpr=([0-9.]+)/.exec(location.search);
      if (dprParam) config.devicePixelRatio = parseFloat(dprParam[1]);

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js" + v;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.opacity = "0";
          setTimeout(function () { loading.style.display = "none"; }, 900);
          canvas.focus();
        }).catch(function (message) {
          showBanner("読み込みに失敗しました。ページを再読み込みしてください。（" + String(message).split("\n")[0] + "）", "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
